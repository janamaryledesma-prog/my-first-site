  <main>
    <h1>Contact Me</h1>
    <address>
      Email: <a href="mailto:janamaryledesma@gmail.com">janamaryledesma@gmail.com</a>
    </address>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading" class="sr-only">Contact Form</h2>
      <form action="#" method="POST">
        <fieldset>
          <legend>Contact Form</legend>
          <p>
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" required minlength="2" autocomplete="name">
          </p>
          <p>
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </p>
          <p>
            <label for="phone">Phone (optional)</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9\-\s\+\(\)]{7,}" autocomplete="tel">
          </p>
          <p>
            <label for="source">How did you hear about me?</label>
            <select id="source" name="source">
              <option value="" disabled selected>-- Select an option --</option>
              <option value="search-engine">Search Engine</option>
              <option value="social-media">Social Media</option>
              <option value="referral">Friend or Colleague</option>
              <option value="other">Other</option>
            </select>
          </p>
          <p>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </p>
          <p class="form-checkbox-group">
            <input type="checkbox" id="consent" name="consent" required>
            <label for="consent">I agree to be contacted.</label>
          </p>
          <p>
            <button type="submit">Send Message</button>
          </p>
        </fieldset>
      </form>
    </section>
  </main>
